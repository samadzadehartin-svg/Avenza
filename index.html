<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="AVENZA Collection — فروش تکی و عمده پوشاک در تهران" />
    <link rel="icon" href="/avenza-logo.webp" />
    <title>AVENZA Collection</title>
    <style>
      .avenza-contact-static{
        background:#fff;
        color:#111;
        border-top:1px solid #ededed;
        padding:72px 28px 64px;
        font-family:"IRANSansX","IRANSans","IranSans",Vazirmatn,Tahoma,Arial,sans-serif;
      }
      .avenza-contact-static__inner{
        width:min(1180px,100%);
        margin:0 auto;
        display:grid;
        grid-template-columns:340px minmax(0,1fr);
        gap:72px;
        align-items:start;
      }
      .avenza-contact-static__brand{
        display:flex;
        flex-direction:column;
        align-items:flex-start;
      }
      .avenza-contact-static__logo{
        width:118px;
        height:118px;
        object-fit:cover;
        display:block;
        border-radius:18px;
        border:1px solid #ececec;
        background:#fff;
        margin-bottom:20px;
      }
      .avenza-contact-static__eyebrow{
        display:block;
        direction:ltr;
        font-size:10px;
        font-weight:800;
        letter-spacing:2.2px;
        color:#9b7b50;
        margin-bottom:10px;
      }
      .avenza-contact-static__title{
        margin:0;
        font-size:clamp(30px,3.4vw,48px);
        font-weight:900;
        letter-spacing:-1.5px;
        line-height:1.25;
      }
      .avenza-contact-static__brand p{
        margin:14px 0 0;
        color:#777;
        font-size:13px;
        line-height:2;
      }
      .avenza-contact-static__items{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
      }
      .avenza-contact-static__item{
        min-height:116px;
        background:#fafafa;
        border:1px solid #ececec;
        border-radius:14px;
        padding:20px 22px;
        display:flex;
        flex-direction:column;
        justify-content:center;
        gap:8px;
      }
      .avenza-contact-static__item strong{
        font-size:11px;
        color:#777;
        font-weight:800;
      }
      .avenza-contact-static__item a,
      .avenza-contact-static__item span{
        color:#111;
        line-height:1.9;
        font-size:14px;
        font-weight:700;
        text-decoration:none;
        overflow-wrap:anywhere;
      }
      .avenza-contact-static__item a:hover{color:#9b7b50}
      body.admin-route .avenza-contact-static{display:none!important}
      @media(max-width:860px){
        .avenza-contact-static{padding:52px 20px}
        .avenza-contact-static__inner{grid-template-columns:1fr;gap:34px}
        .avenza-contact-static__brand{align-items:center;text-align:center}
        .avenza-contact-static__items{grid-template-columns:1fr 1fr}
      }
      @media(max-width:560px){
        .avenza-contact-static{padding:44px 16px}
        .avenza-contact-static__logo{width:92px;height:92px;border-radius:14px}
        .avenza-contact-static__items{grid-template-columns:1fr;gap:9px}
        .avenza-contact-static__item{min-height:92px;padding:16px 18px}
        .avenza-contact-static__title{font-size:32px}
      }
    </style>
    <script type="application/ld+json">
      {
        "@context":"https://schema.org",
        "@type":"ClothingStore",
        "name":"AVENZA Collection",
        "telephone":"+989108456261",
        "sameAs":["https://www.instagram.com/Avenza_co/"],
        "address":{
          "@type":"PostalAddress",
          "addressLocality":"تهران",
          "streetAddress":"فردوسی، نبش جمهوری، پاساژ کویتی‌های استانبول، واحد ۱۰۱",
          "addressCountry":"IR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <section class="avenza-contact-static" id="contact" aria-label="اطلاعات تماس AVENZA">
      <div class="avenza-contact-static__inner">
        <div class="avenza-contact-static__brand">
          <img class="avenza-contact-static__logo" src="/avenza-logo.webp" alt="لوگوی AVENZA Collection" />
          <span class="avenza-contact-static__eyebrow">CONTACT · AVENZA</span>
          <h2 class="avenza-contact-static__title">ارتباط با ما</h2>
          <p>برای سفارش، خرید عمده و هماهنگی با AVENZA از راه‌های زیر با ما در تماس باشید.</p>
        </div>
        <div class="avenza-contact-static__items">
          <div class="avenza-contact-static__item"><strong>اینستاگرام</strong><a href="https://www.instagram.com/Avenza_co/" target="_blank" rel="noreferrer" dir="ltr">@Avenza_co</a></div>
          <div class="avenza-contact-static__item"><strong>تماس</strong><a href="tel:09108456261" dir="ltr">09108456261</a></div>
          <div class="avenza-contact-static__item"><strong>واتساپ</strong><a href="https://wa.me/989108456261" target="_blank" rel="noreferrer" dir="ltr">09108456261</a></div>
          <div class="avenza-contact-static__item"><strong>آدرس</strong><span>تهران، فردوسی، نبش جمهوری، پاساژ کویتی‌های استانبول، واحد ۱۰۱</span></div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
